# Builds the installers: Windows x64 and ARM64, each on a GitHub Windows machine of that architecture (B9), and the Linux
# AppImage (x64) on Ubuntu. Every push to a branch other than main runs the check (AU7): it builds each installer as a
# run artifact, attached nowhere, then runs the Windows tests and the install, update and uninstall steps below. The
# repo is public, so the runs cost nothing.
# A release (AU3): create the GitHub release first (a draft is fine, and keeps it from apps until every file is there),
# then push its v* tag, or run this by hand (Actions -> Installers -> Run workflow) with the tag. It builds that tag,
# attaches the installers, their .blockmap and SHA256SUMS-x64, -arm64 and -linux-x64, and only then the update feeds
# (latest.yml, latest-linux.yml), so an app is never offered a version whose files are not all there. One installer
# failing attaches no feed. Installed apps take only a published release that is not a pre-release (Stable channel).
# Tags before v0.1.2 lack the packaging fix and fail on this machine (the NSIS 260-character path).
name: Installers

on:
  push:
    branches-ignore: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach the installers to (the release must exist). Empty runs the check on the chosen branch
        required: false
        default: ''

permissions:
  contents: write

jobs:
  installer:
    strategy:
      # One architecture failing still finishes the other's installer.
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: windows-latest
          - arch: arm64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    # One run per branch and architecture at a time; a newer push waits and replaces any run still waiting. Not
    # cancel-in-progress: four chunks pushing release/v0.1.3 cancelled the 35-minute job before it ever finished
    # (2026-10-22, run 39724311084).
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.arch }}
      cancel-in-progress: false
    timeout-minutes: 90
    env:
      TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name || '') }}
      P9_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.sha }}
      - name: The release exists
        if: env.TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$TAG" --json tagName > /dev/null || { echo "::error::Create the GitHub release for $TAG first (a draft is fine), then run this again"; exit 1; }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26.10.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:win
      - name: Attach to the release
        if: env.TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat dist/windows/SHA256SUMS-$P9_ARCH
          gh release upload "$TAG" dist/windows/*-$P9_ARCH.exe dist/windows/*-$P9_ARCH.exe.blockmap dist/windows/SHA256SUMS-$P9_ARCH --clobber
      # This runner's latest.yml names only its own installer: the feed job merges both and attaches it last.
      - uses: actions/upload-artifact@v4
        if: env.TAG != ''
        with:
          name: feed-windows-${{ matrix.arch }}
          path: dist/windows/latest.yml
          retention-days: 1
      - name: Show the check build
        if: env.TAG == ''
        shell: bash
        run: |
          cat dist/windows/SHA256SUMS-$P9_ARCH
          ls -l dist/windows/*.exe
          # BL11: the web-only packages are devDependencies, so app.asar carries only what the desktop loads.
          ls -l dist/windows/*-unpacked/resources/app.asar
      # The check build, to download from the run's page and install by hand (a tester's laptop).
      - uses: actions/upload-artifact@v4
        if: env.TAG == ''
        with:
          name: windows-installer-${{ matrix.arch }}
          path: |
            dist/windows/*.exe
            dist/windows/SHA256SUMS-${{ matrix.arch }}
          retention-days: 14
      # The Windows-only tests on a real Windows machine of each architecture: the host (.cmd through cmd.exe, a new
      # console, the folder ACL check, the prebuilt DLL) and Job Object stop. After the upload, so a failure keeps the installer.
      - name: Windows host and process-tree tests
        if: env.TAG == ''
        run: node --test test/windows-process-tree.test.mjs
      # GitHub issue #11: the dock's terminal on Windows (ConPTY), through the real routes and the daemon's pipe.
      - name: Windows terminal test
        if: env.TAG == ''
        run: node --test test/windows-terminal.test.mjs
      # GitHub issue #11 (v0.1.5 N1): Mission notes in a folder outside the workspace, through win.canonical and the new
      # renameNamed (no replace): links out, locked names, the 409 conflict and rename onto an existing name.
      - name: Windows notes test
        if: env.TAG == ''
        run: node --test test/mission-notes.test.mjs
      # BL9: the file guard's and the editor host's owner-only checks compare SDDL text. The runner's account is the
      # built-in Administrator (RID 500), which SDDL writes as LA, so the tests now ask Windows for that form.
      - name: Windows file guard test
        if: env.TAG == ''
        run: node --test test/files-windows.test.mjs
      - name: Windows editor host test
        if: env.TAG == ''
        run: node --test --test-name-pattern="Phase 8 \(Windows\)" test/dev.test.mjs
      # v0.1.5 DV2: Dev Focus's folder outside the workspace, on Windows paths: %LOCALAPPDATA%\P9 and the drive root refused,
      # saves there through the guarded save, a junction out refused.
      - name: Windows Dev folder test
        if: env.TAG == ''
        run: node --test test/dev-root.test.mjs
      # GitHub issue #4: install the check build here, then see the daemon task start with no window, come back after the
      # daemon dies, the way the desktop app restarts it, and leave nothing running after the real uninstaller. A runner's session is not a real desktop, so this proves the task and the
      # daemon, not what a person sees.
      - name: Install it here and start the daemon
        if: env.TAG == ''
        shell: pwsh
        timeout-minutes: 28
        run: |
          $exe = (Get-ChildItem dist/windows/*.exe | Select-Object -First 1).FullName
          # Wait for the installer alone (-Wait also waits on its children); run 39522683697 hung here 30 min with no output.
          $setup = Start-Process -FilePath $exe -ArgumentList '/S' -PassThru
          # Run 39530752722: at 4 min the 608 MB installer had no child process and no window, so it was still unpacking (belief).
          # Every 30 s: files written so far and the installer's CPU seconds, so slow and stuck look different.
          $dirs = @((Join-Path $env:LOCALAPPDATA 'Programs\P9 Event Horizon'), (Join-Path $env:ProgramFiles 'P9 Event Horizon'))
          $began = Get-Date
          while (-not $setup.WaitForExit(30000) -and ((Get-Date) - $began).TotalMinutes -lt 12) {
            $files = ($dirs | Where-Object { Test-Path $_ } | ForEach-Object { (Get-ChildItem $_ -Recurse -File -ErrorAction SilentlyContinue).Count } | Measure-Object -Sum).Sum
            Write-Output ('{0:n0} s: {1} files, installer CPU {2:n0} s' -f ((Get-Date) - $began).TotalSeconds, $files, (Get-Process -Id $setup.Id -ErrorAction SilentlyContinue).CPU)
          }
          if (-not $setup.HasExited) {
            $all = Get-CimInstance Win32_Process
            $tree = @($setup.Id); do { $n = $tree.Count; $tree = @($tree + ($all | Where-Object { $tree -contains $_.ParentProcessId } | ForEach-Object ProcessId) | Select-Object -Unique) } while ($tree.Count -gt $n)
            $all | Where-Object { $tree -contains $_.ProcessId } | ForEach-Object { 'proc ' + $_.ProcessId + ' <- ' + $_.ParentProcessId + ': ' + $_.CommandLine }
            Get-Process | Where-Object MainWindowTitle | ForEach-Object { 'window: ' + $_.ProcessName + ' - ' + $_.MainWindowTitle }
            Write-Output ('task registered: ' + [bool](Get-ScheduledTask -TaskName 'P9 Foundation' -ErrorAction SilentlyContinue))
            throw 'the installer did not finish in 12 min'
          }
          Write-Output ('installer exit code: ' + $setup.ExitCode + ' after ' + [int]((Get-Date) - $began).TotalSeconds + ' s')
          # The installer's own run of install-windows.ps1: exit code and output (installer.nsh writes it).
          $app = Join-Path $env:LOCALAPPDATA 'Programs\P9 Event Horizon'
          Get-Content (Join-Path $app 'service-install.log') -ErrorAction SilentlyContinue | ForEach-Object { 'hook: ' + $_ }
          # arm64 job 119719813897: the hook saw no resources\daemon\node.exe though the installer holds it. On disk now?
          Get-ChildItem (Join-Path $app 'resources\daemon') -Force | ForEach-Object { 'daemon dir: ' + $_.Name + ' ' + $_.Length + ' ' + $_.LastWriteTimeUtc.ToString('o') }
          Get-MpThreatDetection -ErrorAction SilentlyContinue | ForEach-Object { 'defender: ' + $_.InitialDetectionTime + ' ' + ($_.Resources -join ', ') }
          # The other ARM64-filtered files: without the app's own exe there is nothing for a tester to start.
          # B10: v0.1.3 unpacked 26,158 files (1,630 MB), 26,028 of them the daemon's node_modules; the daemon now ships as bundles.
          $installed = @(Get-ChildItem $app -Recurse -File -Force)
          Write-Output ('B10 installed: {0:n0} files, {1:n0} MB, installer {2} s' -f $installed.Count, (($installed | Measure-Object Length -Sum).Sum / 1MB), [int]($setup.ExitTime - $began).TotalSeconds)
          $installed | Group-Object { $_.FullName.Substring($app.Length + 1).Split('\')[0..1] -join '\' } | Sort-Object Count -Descending | Select-Object -First 8 | ForEach-Object { 'B10 files: ' + $_.Count + ' ' + $_.Name }
          if ($installed.Count -ge 2000) { throw ('the install has ' + $installed.Count + ' files; B10 keeps it under 2,000') }
          $daemon = 'resources\daemon\node_modules\'
          foreach ($f in 'P9 Event Horizon.exe', 'resources\daemon\node.exe', 'resources\daemon\apps\server\main.mjs', ($daemon + '@agentclientprotocol\claude-agent-acp\dist\index.js'),
            ($daemon + '@agentclientprotocol\codex-acp\dist\index.js'), ($daemon + '@anthropic-ai\claude-agent-sdk-win32-' + $env:P9_ARCH + '\claude.exe')) {
            if (-not (Test-Path -LiteralPath (Join-Path $app $f))) { throw "the installer left out $f" }
          }
          if (-not (Get-ChildItem (Join-Path $app ($daemon + '@openai\codex-win32-' + $env:P9_ARCH)) -Recurse -Filter codex.exe -ErrorAction SilentlyContinue)) { throw 'the installer left out codex.exe' }
          # AU2: the app and the daemon's node.exe are this runner's architecture (the PE header's machine field), not an
          # x64 file running under ARM64 emulation.
          $machine = @{ x64 = 0x8664; arm64 = 0xAA64 }[$env:P9_ARCH]
          foreach ($f in 'P9 Event Horizon.exe', 'resources\daemon\node.exe') {
            $bytes = New-Object byte[] 4096; $stream = [IO.File]::OpenRead((Join-Path $app $f)); $null = $stream.Read($bytes, 0, 4096); $stream.Close()
            $found = [BitConverter]::ToUInt16($bytes, [BitConverter]::ToInt32($bytes, 0x3C) + 4)
            Write-Output ('{0}: machine 0x{1:X4}' -f $f, $found)
            if ($found -ne $machine) { throw "$f is not $env:P9_ARCH" }
          }
          # AU2: the update feed the installed app reads.
          $feed = Get-Content -Raw (Join-Path $app 'resources\app-update.yml')
          Write-Output ('app-update.yml: ' + ($feed -replace '\s+', ' '))
          if ($feed -notmatch 'provider: github') { throw 'app-update.yml does not name the GitHub feed' }
          $script = Join-Path $app 'resources\daemon\scripts\install-windows.ps1'
          # This step's shell is PowerShell 7, so the installer inherits 7's module path: the case run 39535290300 failed on.
          if (-not (Get-ScheduledTask -TaskName 'P9 Foundation' -ErrorAction SilentlyContinue)) { throw 'the installer registered no task (hook: lines above)' }
          $action = (Get-ScheduledTask -TaskName 'P9 Foundation').Actions[0]
          Write-Output ('task runs: ' + $action.Execute + ' ' + $action.Arguments.Substring(0, 40))
          if ($action.Execute -ne 'conhost.exe' -or -not $action.Arguments.StartsWith('--headless ')) { throw 'task is not headless' }
          $file = Join-Path $env:LOCALAPPDATA 'P9\runtime\desktop.json'
          function Wait-Daemon([datetime]$After) {
            $end = (Get-Date).AddSeconds(90)
            while ((Get-Date) -lt $end) { if ((Test-Path $file) -and (Get-Item $file).LastWriteTime -gt $After) { return } ; Start-Sleep 2 }
            Get-ScheduledTaskInfo -TaskName 'P9 Foundation' | Format-List LastRunTime, LastTaskResult
            throw 'the daemon did not write desktop.json in 90 s'
          }
          Wait-Daemon ([datetime]::MinValue)
          Write-Output 'daemon up after install'
          Get-CimInstance Win32_Process -Filter "Name = 'node.exe'" | ForEach-Object { 'node: ' + $_.CommandLine.Substring(0, [Math]::Min(120, $_.CommandLine.Length)) }
          function Get-Daemon { @(Get-CimInstance Win32_Process -Filter "Name = 'node.exe'" | Where-Object { $_.ExecutablePath -like '*\P9 Event Horizon\resources\daemon\node.exe' -or $_.ExecutablePath -like "$env:LOCALAPPDATA\P9\daemon\*\node.exe" }) }
          # arm64 job 119704715150: the task ran the runner's node from PATH, so nothing here matched and /Run was refused.
          if ((Get-Daemon).Count -lt 1) { throw 'the daemon is not the bundled node.exe (node: and hook: lines above)' }
          # AU4: the task runs the fixed launcher, which starts the copy daemon\current names, so an update replaces no file
          # the daemon holds and the version before stays for a rollback.
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $current = [IO.File]::ReadAllText("$env:LOCALAPPDATA\P9\daemon\current")
          Write-Output ('daemon\current: ' + $current + '; launcher: ' + (Test-Path "$env:LOCALAPPDATA\P9\launcher\p9-launch.ps1"))
          if ($current -ne $version) { throw ('daemon\current is ' + $current + ', not ' + $version) }
          if (-not (Test-Path "$env:LOCALAPPDATA\P9\daemon\$version\.complete")) { throw 'the daemon copy has no .complete' }
          if (-not (Test-Path "$env:LOCALAPPDATA\P9\launcher\p9-launch.ps1")) { throw 'no launcher\p9-launch.ps1' }
          if ((Get-ScheduledTask -TaskName 'P9 Foundation').Actions[0].Arguments -notlike '*\P9\launcher\p9-launch.ps1*') { throw 'the task does not run the launcher' }
          if (@(Get-Daemon | Where-Object { $_.ExecutablePath -like "$env:LOCALAPPDATA\P9\daemon\$version\node.exe" }).Count -ne 1) { throw ('the daemon is not daemon\' + $version + '\node.exe') }
          # A daemon that died on its own (issue #4 item 7) is the case the app restarts with schtasks /Run (main.mjs).
          $before = Get-Date
          Get-Daemon | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
          $end = (Get-Date).AddSeconds(30)
          while ((Get-ScheduledTask -TaskName 'P9 Foundation').State -eq 'Running' -and (Get-Date) -lt $end) { Start-Sleep 1 }
          Write-Output ('task state before /Run: ' + (Get-ScheduledTask -TaskName 'P9 Foundation').State)
          schtasks.exe /Run /TN 'P9 Foundation'
          Wait-Daemon $before
          Write-Output 'daemon up again after it died and schtasks /Run (what the app does)'
          # No task at all (deleted, or the installer's own run failed): the app runs the installer's script again, once per
          # launch (main.mjs wake). This runs that same function, teh.mjs repairWindowsTask, on this install's resources folder.
          Get-Daemon | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
          $end = (Get-Date).AddSeconds(30)
          while ((Get-ScheduledTask -TaskName 'P9 Foundation').State -eq 'Running' -and (Get-Date) -lt $end) { Start-Sleep 1 }
          Unregister-ScheduledTask -TaskName 'P9 Foundation' -Confirm:$false
          $before = Get-Date
          # teh.mjs as argv[1] would start its own command line (run 39798563746), so the resources folder comes first.
          node --input-type=module -e "import { pathToFileURL } from 'node:url'; const { repairWindowsTask } = await import(pathToFileURL(process.argv[2]).href); process.exit(await repairWindowsTask(process.argv[1]) ? 0 : 1)" (Join-Path $app 'resources') (Resolve-Path scripts/teh.mjs).Path
          $repair = $LASTEXITCODE
          Get-Content (Join-Path $app 'service-install.log') | Select-Object -Last 15 | ForEach-Object { 'repair log: ' + $_ }
          if ($repair -ne 0) { throw 'the app''s repair failed (repair log: lines above)' }
          $t = Get-ScheduledTask -TaskName 'P9 Foundation' -ErrorAction SilentlyContinue
          if (-not $t -or $t.Actions[0].Execute -ne 'conhost.exe') { throw 'the repair did not register the headless task' }
          Wait-Daemon $before
          Write-Output 'daemon up again after the task was deleted and the app repaired it'
          # Threat model row 32, Windows: Setup's Change the folder runs this same function with the new folder while the daemon
          # is up. install-windows.ps1 now ends the running daemon itself (v0.1.3 review finding 1); before, Start-ScheduledTask
          # met the still-running task and /health kept the old folder. CI does not start the Electron IPC (picker, confirm,
          # refusals, rollback): this proves the script and teh.mjs only.
          $teh = (Resolve-Path scripts/teh.mjs).Path
          $state = Join-Path $env:LOCALAPPDATA 'P9\runtime'
          function Wait-Workspace([string]$Want) {
            node --input-type=module -e "import { pathToFileURL } from 'node:url'; const { health } = await import(pathToFileURL(process.argv[2]).href); let h; for (let i = 0; i < 60; i++) { h = await health(process.argv[3]).catch((e) => ({ workspace: String(e) })); if (h.workspace?.toLowerCase() === process.argv[1].toLowerCase()) break; await new Promise((r) => setTimeout(r, 1000)); } console.log('health workspace: ' + h.workspace); process.exit(h.workspace?.toLowerCase() === process.argv[1].toLowerCase() ? 0 : 1)" $Want $teh $state
            if ($LASTEXITCODE -ne 0) { throw ('/health does not name ' + $Want) }
          }
          $moved = (New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'p9-moved')).FullName
          node --input-type=module -e "import { pathToFileURL } from 'node:url'; const { repairWindowsTask } = await import(pathToFileURL(process.argv[3]).href); process.exit(await repairWindowsTask(process.argv[1], process.argv[2]) ? 0 : 1)" (Join-Path $app 'resources') $moved $teh
          $change = $LASTEXITCODE
          Get-Content (Join-Path $app 'service-install.log') | Select-Object -Last 12 | ForEach-Object { 'change log: ' + $_ }
          if ($change -ne 0) { throw 'install-windows.ps1 -Workspace failed (change log: lines above)' }
          Wait-Workspace $moved
          Write-Output ('daemons after the change: ' + (Get-Daemon).Count)
          if ((Get-Daemon).Count -ne 1) { throw 'not exactly one daemon after the change' }
          Write-Output 'workspace change: /health names the new folder'
          # Fable review finding 1: a saved folder not there now (an unplugged drive) stays in the task with one log line; this start
          # runs on %USERPROFILE%\P9 and /health names both. Once the folder is back, the next start uses it again.
          $a = (Get-ScheduledTask -TaskName 'P9 Foundation').Actions[0]
          $goneDir = Join-Path $env:RUNNER_TEMP 'p9-gone'
          $gone = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes((@{ argv = @('node', 'main', '--workspace', $goneDir) } | ConvertTo-Json -Compress)))
          Register-ScheduledTask -TaskName 'P9 Foundation' -Action (New-ScheduledTaskAction -Execute $a.Execute -Argument ($a.Arguments -replace '-Payload \S+', ('-Payload ' + $gone))) -Force | Out-Null
          node --input-type=module -e "import { pathToFileURL } from 'node:url'; const { repairWindowsTask } = await import(pathToFileURL(process.argv[2]).href); process.exit(await repairWindowsTask(process.argv[1]) ? 0 : 1)" (Join-Path $app 'resources') $teh
          $missing = $LASTEXITCODE
          Get-Content (Join-Path $app 'service-install.log') | Select-Object -Last 12 | ForEach-Object { 'missing-folder log: ' + $_ }
          if ($missing -ne 0) { throw 'a missing saved folder failed the reinstall (missing-folder log: lines above)' }
          if (-not (Select-String -LiteralPath (Join-Path $app 'service-install.log') -Pattern 'p9-gone is not there now' -SimpleMatch -Quiet)) { throw 'the script did not log the missing folder' }
          $kept = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String([regex]::Match((Get-ScheduledTask -TaskName 'P9 Foundation').Actions[0].Arguments, '-Payload (\S+)').Groups[1].Value))
          if (-not $kept.Contains('p9-gone')) { throw 'the task lost the saved folder' }
          Wait-Workspace (Get-Item (Join-Path $env:USERPROFILE 'P9')).FullName
          node --input-type=module -e "import { pathToFileURL } from 'node:url'; const { health } = await import(pathToFileURL(process.argv[2]).href); const h = await health(process.argv[3]); console.log('health savedWorkspace: ' + h.savedWorkspace); process.exit(h.savedWorkspace?.toLowerCase() === process.argv[1].toLowerCase() ? 0 : 1)" $goneDir $teh $state
          if ($LASTEXITCODE -ne 0) { throw '/health does not name the missing saved folder' }
          New-Item -ItemType Directory -Force $goneDir | Out-Null
          node --input-type=module -e "import { pathToFileURL } from 'node:url'; const { repairWindowsTask } = await import(pathToFileURL(process.argv[2]).href); process.exit(await repairWindowsTask(process.argv[1]) ? 0 : 1)" (Join-Path $app 'resources') $teh
          if ($LASTEXITCODE -ne 0) { throw 'the reinstall with the saved folder back failed' }
          Wait-Workspace (Get-Item $goneDir).FullName
          Write-Output 'missing saved folder: kept in the task, default for that start, the saved folder again once it is back'
          # Review finding 2: a task payload the script cannot read failed every reinstall; now it falls to %USERPROFILE%\P9.
          # Review finding 3 in the same run: an hour-old ns*.tmp with P9's marker goes, another app's (app-64.7z) stays.
          $a = (Get-ScheduledTask -TaskName 'P9 Foundation').Actions[0]
          Register-ScheduledTask -TaskName 'P9 Foundation' -Action (New-ScheduledTaskAction -Execute $a.Execute -Argument ($a.Arguments -replace '-Payload \S+', '-Payload not-base64!')) -Force | Out-Null
          $marked = New-Item -ItemType Directory -Force (Join-Path $env:TEMP 'nsp9ci-marked.tmp'); New-Item -ItemType File -Force (Join-Path $marked 'p9-event-horizon.marker') | Out-Null
          $other = New-Item -ItemType Directory -Force (Join-Path $env:TEMP 'nsp9ci-other.tmp'); New-Item -ItemType File -Force (Join-Path $other 'app-64.7z') | Out-Null
          foreach ($d in $marked, $other) { $d.LastWriteTime = (Get-Date).AddHours(-2) }
          node --input-type=module -e "import { pathToFileURL } from 'node:url'; const { repairWindowsTask } = await import(pathToFileURL(process.argv[2]).href); process.exit(await repairWindowsTask(process.argv[1]) ? 0 : 1)" (Join-Path $app 'resources') $teh
          $bad = $LASTEXITCODE
          Get-Content (Join-Path $app 'service-install.log') | Select-Object -Last 12 | ForEach-Object { 'payload log: ' + $_ }
          if ($bad -ne 0) { throw 'a bad task payload failed the reinstall (payload log: lines above)' }
          if (-not (Select-String -LiteralPath (Join-Path $app 'service-install.log') -Pattern 'task payload unreadable' -SimpleMatch -Quiet)) { throw 'the script did not log the unreadable payload' }
          Wait-Workspace (Get-Item (Join-Path $env:USERPROFILE 'P9')).FullName
          Write-Output 'bad payload: reinstalled on the default folder'
          if (Test-Path $marked.FullName) { throw "P9's marked ns*.tmp was kept" }
          if (-not (Test-Path $other.FullName)) { throw "another app's ns*.tmp was removed" }
          Write-Output "temp cleanup: P9's marked folder removed, another app's kept"
          # v0.1.5 W4 (issue #12 item 1): every daemon start above loaded the file guard's node:ffi; no warning line for it.
          $daemonLog = Join-Path $env:LOCALAPPDATA 'P9\daemon.log'
          Write-Output ('daemon.log: {0} lines, {1} host starts' -f @(Get-Content $daemonLog).Count, @(Select-String -LiteralPath $daemonLog -Pattern 'host started' -SimpleMatch).Count)
          if (Select-String -LiteralPath $daemonLog -Pattern 'FFI is an experimental' -SimpleMatch -Quiet) { throw 'daemon.log has the FFI experimental warning' }
          # v0.1.5 W3 (issue #11 bug 8): schtasks /end stops conhost only; the host must see it go and end node with its job.
          function Get-DaemonHost { @(Get-CimInstance Win32_Process -Filter "Name = 'powershell.exe'" | Where-Object { ($_.CommandLine -like '*windows-host.ps1*-Mode Daemon*' -or $_.CommandLine -like '*\launcher\p9-launch.ps1*') }) }
          Write-Output ('before /End: {0} daemon, {1} host' -f (Get-Daemon).Count, (Get-DaemonHost).Count)
          schtasks.exe /End /TN 'P9 Foundation'
          $end = (Get-Date).AddSeconds(15)
          while (((Get-Daemon).Count -gt 0 -or (Get-DaemonHost).Count -gt 0) -and (Get-Date) -lt $end) { Start-Sleep 1 }
          Write-Output ('after /End: {0} daemon, {1} host' -f (Get-Daemon).Count, (Get-DaemonHost).Count)
          if ((Get-Daemon).Count -gt 0 -or (Get-DaemonHost).Count -gt 0) { throw 'schtasks /End left the daemon or its host running' }
          # v0.1.5 W1 and W2 (issue #11 bug 2): an app and a "detach": true script's child outlive a daemon restart, made by
          # teh.mjs restartWindowsTask, the function the desktop's restart button calls.
          $keep = Join-Path $env:RUNNER_TEMP 'p9-keep.js'
          Set-Content -LiteralPath $keep -Value "const fs = require('fs'); const [file, role] = process.argv.slice(2); if (role === 'child') { fs.writeFileSync(file + '.t', String(process.pid)); fs.renameSync(file + '.t', file); } else require('child_process').spawn(process.execPath, [__filename, file, 'child'], { detached: true, stdio: 'ignore' }).unref(); setInterval(() => {}, 1e9);"
          $node = (Get-Command node).Source
          $appPid = Join-Path $env:RUNNER_TEMP 'p9-app.pid'; $childPid = Join-Path $env:RUNNER_TEMP 'p9-child.pid'
          $ws = (Get-Item (Join-Path $env:USERPROFILE 'P9')).FullName
          New-Item -ItemType Directory -Force (Join-Path $ws 'waiting') | Out-Null
          @{ scripts = @(@{ id = 'keep'; title = 'Keep'; detach = $true; cmd = @($node, $keep, $childPid) }); apps = @(@{ id = 'keep'; title = 'Keep'; cmd = @($node, $keep, $appPid, 'child') }); pages = @() } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $ws 'registry.json')
          $settingsFile = Join-Path $env:APPDATA 'P9\settings.json'
          New-Item -ItemType Directory -Force (Split-Path $settingsFile) | Out-Null
          @{ primary = 'primary.md'; registry = 'registry.json'; waiting = 'waiting' } | ConvertTo-Json | Set-Content -LiteralPath $settingsFile
          $before = Get-Date
          schtasks.exe /Run /TN 'P9 Foundation'
          Wait-Daemon $before
          node --input-type=module -e "import { pathToFileURL } from 'node:url'; const { daemonRequest } = await import(pathToFileURL(process.argv[2]).href); const app = await daemonRequest(process.argv[1], 'POST', '/apps/keep/launch', {}); const run = await daemonRequest(process.argv[1], 'POST', '/scripts/keep/run', {}); console.log('launch: ' + app.status + ' run: ' + run.status); process.exit(app.status === 200 && run.status === 202 ? 0 : 1)" $state $teh
          if ($LASTEXITCODE -ne 0) { throw 'the app or the detach script did not start' }
          $end = (Get-Date).AddSeconds(15)
          while (-not ((Test-Path $appPid) -and (Test-Path $childPid)) -and (Get-Date) -lt $end) { Start-Sleep 1 }
          if (-not ((Test-Path $appPid) -and (Test-Path $childPid))) { throw 'the app or the detach script''s child wrote no pid in 15 s' }
          $kept = @((Get-Content $appPid), (Get-Content $childPid)) | ForEach-Object { [int]$_ }
          $old = (Get-Daemon).ProcessId
          $before = Get-Date
          node --input-type=module -e "import { pathToFileURL } from 'node:url'; const { restartWindowsTask } = await import(pathToFileURL(process.argv[2]).href); const r = await restartWindowsTask(process.argv[1]); console.log('restart: ' + JSON.stringify(r)); process.exit(r.restarted ? 0 : 1)" $state $teh
          if ($LASTEXITCODE -ne 0) { throw 'restartWindowsTask failed (restart: line above)' }
          Wait-Daemon $before
          Write-Output ('after restart: daemons {0} (old {1}), hosts {2}' -f ((Get-Daemon).ProcessId -join ','), ($old -join ','), (Get-DaemonHost).Count)
          if ((Get-Daemon).Count -ne 1 -or (Get-DaemonHost).Count -ne 1 -or ((Get-Daemon).ProcessId | Where-Object { $old -contains $_ })) { throw 'the restart did not leave exactly one new daemon and host' }
          $alive = @($kept | Where-Object { Get-Process -Id $_ -ErrorAction SilentlyContinue })
          Write-Output ('kept across the restart: app {0}, detach script child {1}: {2} alive' -f $kept[0], $kept[1], $alive.Count)
          $kept | ForEach-Object { Stop-Process -Id $_ -Force -ErrorAction SilentlyContinue }
          Remove-Item -LiteralPath $settingsFile
          if ($alive.Count -ne 2) { throw 'a daemon restart ended the app or the detach script''s child' }
          # The real uninstaller, silent and in place (_?= makes it wait): no daemon left, no task left. Stop-ScheduledTask
          # alone left the daemon running (run 39540753837), which an update over this version would hit too.
          $uninstaller = (Get-ChildItem $app -Filter 'Uninstall*.exe' | Select-Object -First 1).FullName
          $began = Get-Date
          $un = Start-Process -FilePath $uninstaller -ArgumentList '/S', ('_?=' + $app) -PassThru
          if (-not $un.WaitForExit(600000)) { throw 'the uninstaller did not finish in 10 min' }
          Write-Output ('uninstaller exit code: ' + $un.ExitCode + ' after ' + [int]((Get-Date) - $began).TotalSeconds + ' s')
          Start-Sleep 3
          $left = Get-Daemon
          Write-Output ('daemon processes left after uninstall: ' + $left.Count)
          if ($left.Count -gt 0) { throw 'the uninstaller left the daemon running' }
          if (Get-ScheduledTask -TaskName 'P9 Foundation' -ErrorAction SilentlyContinue) { throw 'the uninstaller left the task' }
          foreach ($d in 'daemon', 'launcher') { if (Test-Path "$env:LOCALAPPDATA\P9\$d") { throw ('the uninstaller left %LOCALAPPDATA%\P9\' + $d) } }
          Write-Output 'uninstall: no daemon, no task, no daemon copies'
      # BL12: an update over the newest published release, which is what a tester's laptop has. v0.1.4 review finding 2
      # (v0.1.3's 26,028-file daemon node_modules; one open handle there aborts the update) passed over v0.1.3 here, and
      # every later release ships the bundled daemon. Install that release, wait for its daemon, install this build over
      # it, then count. Uninstalls at the end, so the next step starts clean.
      - name: Update over the newest release
        if: env.TAG == ''
        shell: pwsh
        timeout-minutes: 40
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pre-releases count: every P9 release so far is one.
          $tag = gh release list -R $env:GITHUB_REPOSITORY --exclude-drafts --limit 1 --json tagName -q '.[0].tagName'
          if ($LASTEXITCODE -ne 0 -or -not $tag) { throw 'gh release list found no release' }
          $old = (New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'p9-newest')).FullName
          gh release download $tag -R $env:GITHUB_REPOSITORY -D $old -p "*-windows-$env:P9_ARCH.exe" -p "SHA256SUMS-$env:P9_ARCH" --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release download $tag failed" }
          $oldExe = (Get-ChildItem $old -Filter "*-windows-$env:P9_ARCH.exe" | Select-Object -First 1).FullName
          # @(): the file is one line, and -match on a lone string returns $true, not the line (run 39826320042).
          $want = (@(Get-Content (Join-Path $old "SHA256SUMS-$env:P9_ARCH")) -match [regex]::Escape((Split-Path $oldExe -Leaf)) -split '\s+')[0]
          if ((Get-FileHash $oldExe -Algorithm SHA256).Hash -ne $want) { throw "the $tag installer does not match its SHA256SUMS" }
          $app = Join-Path $env:LOCALAPPDATA 'Programs\P9 Event Horizon'
          $file = Join-Path $env:LOCALAPPDATA 'P9\runtime\desktop.json'
          function Get-Daemon { @(Get-CimInstance Win32_Process -Filter "Name = 'node.exe'" | Where-Object { $_.ExecutablePath -like '*\P9 Event Horizon\resources\daemon\node.exe' -or $_.ExecutablePath -like "$env:LOCALAPPDATA\P9\daemon\*\node.exe" }) }
          function Install-Setup([string]$Exe, [string]$Name) {
            $began = Get-Date
            $setup = Start-Process -FilePath $Exe -ArgumentList '/S' -PassThru
            $null = $setup.Handle # without the handle held, ExitCode reads empty after the exit
            if (-not $setup.WaitForExit(900000)) { throw "the $Name installer did not finish in 15 min" }
            Write-Output ("$Name installer exit code: " + $setup.ExitCode + ' after ' + [int]($setup.ExitTime - $began).TotalSeconds + ' s')
            Get-Content (Join-Path $app 'service-install.log') -ErrorAction SilentlyContinue | Select-Object -Last 8 | ForEach-Object { "$Name hook: " + $_ }
            if ($setup.ExitCode -ne 0) { throw "the $Name installer exited with $($setup.ExitCode)" }
            $end = (Get-Date).AddSeconds(90)
            while ((Get-Date) -lt $end -and -not ((Test-Path $file) -and (Get-Item $file).LastWriteTime -gt $began -and (Get-Daemon).Count -ge 1)) { Start-Sleep 2 }
            if ((Get-Daemon).Count -lt 1 -or (Get-Item $file -ErrorAction SilentlyContinue).LastWriteTime -le $began) { throw "the $Name daemon did not start in 90 s" }
            Write-Output "$Name daemon up"
          }
          Install-Setup $oldExe $tag
          Install-Setup (Get-ChildItem dist/windows/*.exe | Select-Object -First 1).FullName 'this build'
          $installed = @(Get-ChildItem $app -Recurse -File -Force)
          Write-Output ('B10 update over {0}: {1:n0} files installed' -f $tag, $installed.Count)
          if ($installed.Count -ge 2000) { throw ('the update left ' + $installed.Count + ' files; B10 keeps it under 2,000') }
          if (-not (Test-Path -LiteralPath (Join-Path $app 'resources\daemon\apps\server\main.mjs'))) { throw 'the update left out main.mjs' }
          if ((Get-Daemon).Count -ne 1) { throw ('daemons after the update: ' + (Get-Daemon).Count) }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if (@(Get-Daemon | Where-Object { $_.ExecutablePath -like "$env:LOCALAPPDATA\P9\daemon\$version\node.exe" }).Count -ne 1) { throw ('after the update the daemon is not daemon\' + $version + '\node.exe') }
          Write-Output "update over ${tag}: one daemon up"
          $uninstaller = (Get-ChildItem $app -Filter 'Uninstall*.exe' | Select-Object -First 1).FullName
          $un = Start-Process -FilePath $uninstaller -ArgumentList '/S', ('_?=' + $app) -PassThru
          if (-not $un.WaitForExit(600000)) { throw 'the uninstaller did not finish in 10 min' }
          Start-Sleep 3
          if ((Get-Daemon).Count -gt 0 -or (Get-ScheduledTask -TaskName 'P9 Foundation' -ErrorAction SilentlyContinue)) { throw 'the uninstaller left the daemon or the task' }
          Write-Output 'uninstall after the update: no daemon, no task'
      # GitHub issue #6 B5: the runner is an admin, and a tester is not. A standard local user, p9user, installs over v0.1.1's
      # task, runs v0.1.2's install-windows.ps1 over that install (B1's case, recorded, not required), installs this build
      # again, then runs teh doctor. p9user's files are owner-only, so every check runs as p9user, through a Scheduled Task
      # with its password (a batch logon); the scripts and their output go through C:\p9ci, which p9user may write.
      - name: Install twice as a standard user
        if: env.TAG == ''
        shell: pwsh
        timeout-minutes: 40
        run: |
          git fetch --no-tags --depth=1 origin refs/tags/v0.1.2:refs/tags/v0.1.2
          $ci = 'C:\p9ci'
          New-Item -ItemType Directory -Force -Path $ci | Out-Null
          icacls.exe $ci /grant '*S-1-1-0:(OI)(CI)M' | Out-Null
          Copy-Item (Get-ChildItem dist/windows/*.exe | Select-Object -First 1).FullName (Join-Path $ci 'setup.exe')
          git show v0.1.2:scripts/install-windows.ps1 | Set-Content -LiteralPath (Join-Path $ci 'install-v012.ps1') -Encoding utf8
          # 14 characters: net user asks a question nobody can answer for a longer one.
          $password = 'P9!a' + [guid]::NewGuid().ToString('N').Substring(0, 10)
          net.exe user p9user $password /add | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'net user failed' }
          Write-Output ('p9user groups: ' + ((net.exe user p9user | Select-String 'Group Memberships') -join ' '))
          # A task with a password is a batch logon; Users may lack that right on Windows Server (belief), so grant it.
          $sid = (New-Object Security.Principal.NTAccount 'p9user').Translate([Security.Principal.SecurityIdentifier]).Value
          secedit.exe /export /cfg (Join-Path $ci 'rights.inf') /areas USER_RIGHTS | Out-Null
          $inf = Get-Content (Join-Path $ci 'rights.inf')
          $inf = if ($inf -match '^SeBatchLogonRight') { $inf -replace '^(SeBatchLogonRight\s*=.*)$', ('$1,*' + $sid) } else { $inf -replace '^\[Privilege Rights\]$', ('[Privilege Rights]' + [Environment]::NewLine + 'SeBatchLogonRight = *' + $sid) }
          Set-Content (Join-Path $ci 'rights.inf') $inf -Encoding Unicode
          secedit.exe /configure /db (Join-Path $ci 'rights.sdb') /cfg (Join-Path $ci 'rights.inf') /areas USER_RIGHTS | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'secedit failed' }
          $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -ExecutionTimeLimit ([TimeSpan]::Zero)
          function Start-AsUser([string]$Task, [string]$Execute, [string]$Argument) {
            $action = New-ScheduledTaskAction -Execute $Execute -Argument $Argument
            Register-ScheduledTask -TaskName $Task -Action $action -User 'p9user' -Password $password -RunLevel Limited -Settings $settings -Force | Out-Null
            Start-ScheduledTask -TaskName $Task
          }
          # Runs $Body as p9user and prints its output. Done means it ended without an error; a throw ends it as FAILED.
          $wrapper = @'
          $ErrorActionPreference = 'Stop'
          try { & { @@BODY@@ } *>&1 | Out-File -LiteralPath '@@LOG@@' -Encoding utf8; 'P9CI_DONE' | Out-File -LiteralPath '@@LOG@@' -Append -Encoding utf8 }
          catch { ('P9CI_FAILED: ' + $_ + ' ' + $_.InvocationInfo.PositionMessage) | Out-File -LiteralPath '@@LOG@@' -Append -Encoding utf8 }
          '@
          function As-User([string]$Name, [string]$Body) {
            $file = Join-Path $ci ($Name + '.ps1'); $log = Join-Path $ci ($Name + '.log')
            Set-Content -LiteralPath $file -Encoding utf8 -Value $wrapper.Replace('@@LOG@@', $log).Replace('@@BODY@@', $Body)
            Start-AsUser ('p9ci-' + $Name) 'powershell.exe' ('-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "' + $file + '"')
            $end = (Get-Date).AddMinutes(15)
            while ((Get-Date) -lt $end -and -not ((Test-Path $log) -and (Select-String -LiteralPath $log -Pattern '^P9CI_(DONE|FAILED)' -Quiet))) { Start-Sleep 5 }
            Get-Content -LiteralPath $log -ErrorAction SilentlyContinue | ForEach-Object { $Name + ': ' + $_ }
            if (-not (Select-String -LiteralPath $log -Pattern '^P9CI_DONE' -Quiet -ErrorAction SilentlyContinue)) {
              Get-ScheduledTaskInfo -TaskName ('p9ci-' + $Name) | Format-List LastRunTime, LastTaskResult
              throw ($Name + ' did not finish as p9user')
            }
          }
          # a. v0.1.1's task: visible powershell.exe, and (B7) a payload with no --workspace.
          As-User 'stale' @'
          $payload = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes('{"argv":["C:\\p9old\\node.exe","C:\\p9old\\main.mjs"]}'))
          $action = New-ScheduledTaskAction -Execute 'powershell.exe' -Argument ('-NoProfile -File C:\p9old\windows-host.ps1 -Mode Daemon -Payload ' + $payload)
          $me = [Security.Principal.WindowsIdentity]::GetCurrent().Name
          Register-ScheduledTask -TaskName 'P9 Foundation' -Action $action -Principal (New-ScheduledTaskPrincipal -UserId $me -LogonType Interactive -RunLevel Limited) -Force | Out-Null
          'planted as ' + $me + ': ' + (Get-ScheduledTask -TaskName 'P9 Foundation').Actions[0].Execute
          '@
          # b and d. This build, silent, as p9user: the task is this version's and the workspace the default (B1, B7).
          $install = @'
          $began = Get-Date
          $setup = Start-Process -FilePath 'C:\p9ci\setup.exe' -ArgumentList '/S' -PassThru
          $setup.WaitForExit()
          'installer exit ' + $setup.ExitCode + ' after ' + [int]((Get-Date) - $began).TotalSeconds + ' s'
          $hook = Join-Path $env:LOCALAPPDATA 'Programs\P9 Event Horizon\service-install.log'
          Get-Content -LiteralPath $hook | ForEach-Object { 'hook: ' + $_ }
          if (-not (Select-String -LiteralPath $hook -SimpleMatch 'P9_WINDOWS_TASK_INSTALLED' -Quiet)) { throw 'install-windows.ps1 did not finish' }
          $a = (Get-ScheduledTask -TaskName 'P9 Foundation').Actions[0]
          'task: ' + $a.Execute + ' ' + $a.Arguments.Substring(0, 60)
          if ($a.Execute -ne 'conhost.exe' -or -not $a.Arguments.StartsWith('--headless ')) { throw 'the task is not this version''s' }
          if ($a.Arguments -notmatch '-Payload (\S+)') { throw 'no payload' }
          $argv = @(([Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($Matches[1])) | ConvertFrom-Json).argv)
          $workspace = $argv[[Array]::IndexOf([string[]]$argv, '--workspace') + 1]
          'workspace: ' + $workspace
          if ($workspace -ne (Join-Path $env:USERPROFILE 'P9')) { throw 'the workspace is not %USERPROFILE%\P9' }
          Set-Content -LiteralPath 'C:\p9ci\task-arguments.txt' -Value $a.Arguments
          Get-ChildItem -LiteralPath $env:TEMP -Directory -Filter 'ns*.tmp' -ErrorAction SilentlyContinue | ForEach-Object { 'temp: ' + $_.Name + ' ' + $_.LastWriteTime.ToString('o') + ' ' + ((Get-ChildItem -LiteralPath $_.FullName -Name) -join ',') }
          '@
          As-User 'install-1' $install
          # c. The A side of B1: v0.1.2's script over that install. Recorded only: CI may not see what a tester's laptop did.
          As-User 'v012' @'
          $scripts = Join-Path $env:LOCALAPPDATA 'Programs\P9 Event Horizon\resources\daemon\scripts'
          Copy-Item 'C:\p9ci\install-v012.ps1' (Join-Path $scripts 'install-v012.ps1')
          $ErrorActionPreference = 'Continue'
          $out = @(& powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $scripts 'install-v012.ps1') 2>&1 | ForEach-Object { [string]$_ })
          $code = $LASTEXITCODE
          $out | ForEach-Object { 'v0.1.2: ' + $_ }
          'v0.1.2 exit ' + $code
          if ($out -match 'PrivilegeNotHeld|SeSecurityPrivilege') { 'B1 REPRODUCED: v0.1.2 Set-Acl threw for a standard user over an install' } else { 'B1 NOT REPRODUCED: v0.1.2 Set-Acl did not throw PrivilegeNotHeld here' }
          '@
          As-User 'install-2' $install
          # e and f. teh doctor as p9user until the daemon answers. First from the installer's own start of the task; an
          # Interactive task may not start for a user who is not logged on (belief), so then start its action directly.
          $doctor = @'
          $state = Join-Path $env:LOCALAPPDATA 'P9\runtime'
          $daemon = Join-Path $env:LOCALAPPDATA 'Programs\P9 Event Horizon\resources\daemon'
          $ErrorActionPreference = 'Continue'
          $end = (Get-Date).AddSeconds(@@SECONDS@@)
          do { $bundle = & (Join-Path $daemon 'node.exe') (Join-Path $daemon 'scripts\teh.mjs') doctor --state $state 2>$null | Out-String; $code = $LASTEXITCODE; if ($code -ne 0) { Start-Sleep 5 } } while ($code -ne 0 -and (Get-Date) -lt $end)
          'doctor exit ' + $code
          $bundle
          Set-Content -LiteralPath 'C:\p9ci\doctor.json' -Value $bundle
          Get-Content -LiteralPath (Join-Path $env:LOCALAPPDATA 'P9\daemon.log') -Tail 20 -ErrorAction SilentlyContinue | ForEach-Object { 'daemon.log: ' + $_ }
          '@
          As-User 'doctor-1' $doctor.Replace('@@SECONDS@@', '45')
          if (-not (Get-Content C:\p9ci\doctor-1.log | Select-String '^doctor exit 0' -Quiet)) {
            Write-Output 'the task did not bring the daemon up for a user with no logon session; starting its action as p9user'
            Start-AsUser 'p9ci-daemon' 'powershell.exe' ((Get-Content C:\p9ci\task-arguments.txt -Raw).Trim() -replace '^--headless powershell\.exe ', '')
            As-User 'doctor-2' $doctor.Replace('@@SECONDS@@', '120')
          }
          $bundle = Get-Content C:\p9ci\doctor.json -Raw | ConvertFrom-Json
          if ($bundle.daemon.status -ne 'ok') { throw 'teh doctor: the daemon did not answer p9user' }
          if (-not ($bundle.logs | Where-Object event -eq 'P9_READY')) { throw 'teh doctor: no P9_READY from daemon.log' }
          if ($bundle.unit.SubState -ne 'conhost') { throw 'teh doctor: the task is not this version''s' }
          Write-Output 'standard user: installed over v0.1.1''s task, installed again, daemon answered teh doctor with P9_READY in daemon.log'
      # AU1 + AU4 end to end, x64 only (the same code on arm64): this build (N) installed, its feed pointed at a local
      # server holding a build one patch version newer (N+1), then the app started. It downloads N+1 on its own, installs it
      # when the window closes, and N+1's daemon runs from daemon\N+1 with daemon\N kept. A generic feed stands in for
      # GitHub's: the real feed can only be checked once two public releases that are not pre-releases exist. Last in the
      # job: the N+1 build replaces the files in dist/windows.
      - name: Update itself from a local feed
        if: env.TAG == '' && matrix.arch == 'x64'
        shell: pwsh
        timeout-minutes: 50
        run: |
          $app = Join-Path $env:LOCALAPPDATA 'Programs\P9 Event Horizon'
          $p9 = Join-Path $env:LOCALAPPDATA 'P9'
          function Get-Daemon { @(Get-CimInstance Win32_Process -Filter "Name = 'node.exe'" | Where-Object { $_.ExecutablePath -like "$p9\daemon\*\node.exe" }) }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $v = [version]$version
          $next = '{0}.{1}.{2}' -f $v.Major, $v.Minor, ($v.Build + 1)
          $setup = Start-Process -FilePath (Resolve-Path "dist/windows/p9-event-horizon-$version-windows-x64.exe") -ArgumentList '/S' -PassThru
          $null = $setup.Handle
          if (-not $setup.WaitForExit(900000) -or $setup.ExitCode -ne 0) { throw "the $version installer failed: $($setup.ExitCode)" }
          npm pkg set "version=$next"
          if ($LASTEXITCODE -ne 0) { throw 'npm pkg set failed' }
          pnpm package:win
          if ($LASTEXITCODE -ne 0) { throw "the $next build failed" }
          $feed = (New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'p9-feed')).FullName
          Copy-Item "dist/windows/p9-event-horizon-$next-windows-x64.exe", "dist/windows/p9-event-horizon-$next-windows-x64.exe.blockmap", 'dist/windows/latest.yml' $feed
          Get-Content (Join-Path $feed 'latest.yml')
          $yml = Join-Path $app 'resources\app-update.yml'
          @(Get-Content $yml | Where-Object { $_ -notmatch '^(provider|owner|repo|url):' }) + 'provider: generic' + 'url: http://127.0.0.1:8123/' | Set-Content $yml
          $server = Start-Process python -ArgumentList '-m', 'http.server', '8123', '--bind', '127.0.0.1', '--directory', $feed -PassThru
          try {
            $began = Get-Date
            Start-Process (Join-Path $app 'P9 Event Horizon.exe')
            $end = $began.AddMinutes(10)
            do { Start-Sleep 5; $log = Get-ChildItem $env:APPDATA -Directory | ForEach-Object { Get-Item (Join-Path $_.FullName 'p9-update.log') -ErrorAction SilentlyContinue } | Select-Object -First 1 }
            while ((Get-Date) -lt $end -and -not ($log -and (Select-String -LiteralPath $log.FullName "state ready $next" -SimpleMatch -Quiet)))
            if ($log) { Get-Content $log.FullName | ForEach-Object { 'p9-update.log: ' + $_ } }
            if (-not ($log -and (Select-String -LiteralPath $log.FullName "state ready $next" -SimpleMatch -Quiet))) { throw "the app did not download $next in 10 min" }
            # Closing the window quits the app, and electron-updater runs the downloaded installer silently on the way out.
            Get-Process 'P9 Event Horizon' -ErrorAction SilentlyContinue | Where-Object MainWindowHandle -ne 0 | ForEach-Object { $null = $_.CloseMainWindow() }
            $end = (Get-Date).AddMinutes(15)
            $installed = Join-Path $app 'resources\daemon\package.json'
            # The installer rewrites these files while this polls: a missing or half-written one reads as not yet.
            function Test-Updated {
              try {
                (Get-Content $installed -Raw | ConvertFrom-Json).version -eq $next -and
                  "$(Get-Content (Join-Path $p9 'daemon\current') -Raw)".Trim() -eq $next -and
                  @(Get-Daemon | Where-Object { $_.ExecutablePath -like "$p9\daemon\$next\node.exe" }).Count -eq 1
              } catch { $false }
            }
            while ((Get-Date) -lt $end -and -not (Test-Updated)) { Start-Sleep 5 }
          } finally { Stop-Process -Id $server.Id -ErrorAction SilentlyContinue }
          Get-Content (Join-Path $app 'service-install.log') -ErrorAction SilentlyContinue | Select-Object -Last 8 | ForEach-Object { 'hook: ' + $_ }
          $now = (Get-Content $installed -Raw -ErrorAction SilentlyContinue | ConvertFrom-Json).version
          if ($now -ne $next) { throw "after closing the app the installed version is $now, not $next" }
          if ((Get-Content (Join-Path $p9 'daemon\current') -Raw).Trim() -ne $next) { throw "daemon\current is not $next" }
          if (@(Get-Daemon).Count -ne 1 -or @(Get-Daemon | Where-Object { $_.ExecutablePath -like "$p9\daemon\$next\node.exe" }).Count -ne 1) { throw "the daemon is not one daemon\$next\node.exe" }
          if (-not (Test-Path (Join-Path $p9 "daemon\$version\.complete"))) { throw "the update did not keep daemon\$version" }
          Write-Output "installed $version updated itself to $next from the feed; daemon runs from daemon\$next, daemon\$version kept"

  # AU2: the Linux AppImage, x64 only (no arm64 Linux build yet). Its daemon cannot run from the AppImage's mount, which
  # goes away when the app quits: AU4 copies it to ~/.local/share/p9/daemon first.
  appimage:
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-appimage
      cancel-in-progress: false
    timeout-minutes: 45
    env:
      TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name || '') }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.sha }}
      - name: The release exists
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$TAG" --json tagName > /dev/null || { echo "::error::Create the GitHub release for $TAG first (a draft is fine), then run this again"; exit 1; }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26.10.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:linux
      # What the AppImage holds, unpacked without FUSE: the feed, the daemon's own Linux node, the bundled daemon.
      - name: Check the AppImage
        run: |
          cat dist/linux/SHA256SUMS-linux-x64
          image=$(ls dist/linux/*.AppImage)
          ls -l "$image"
          ls -l dist/linux/*-unpacked/resources/app.asar
          chmod +x "$image"
          (cd "$RUNNER_TEMP" && "$image" --appimage-extract > /dev/null)
          root="$RUNNER_TEMP/squashfs-root/resources"
          cat "$root/app-update.yml"
          grep -q 'provider: github' "$root/app-update.yml"
          file "$root/daemon/node" | tee /dev/stderr | grep -q 'x86-64'
          test "$("$root/daemon/node" --version)" = v26.10.0
          test -f "$root/daemon/apps/server/main.mjs"
          test ! -e "$root/daemon/node.exe"
      - name: Attach to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/linux/*.AppImage dist/linux/SHA256SUMS-linux-x64 --clobber
      - uses: actions/upload-artifact@v4
        if: env.TAG != ''
        with:
          name: feed-linux-x64
          path: dist/linux/latest-linux.yml
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: env.TAG == ''
        with:
          name: linux-appimage-x64
          path: |
            dist/linux/*.AppImage
            dist/linux/SHA256SUMS-linux-x64
          retention-days: 14

  # AU3: the update feeds, attached last and only when every installer is on the release (a failed job skips this one).
  feed:
    needs: [installer, appimage]
    if: inputs.tag != '' || github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 26.10.0
      - uses: actions/download-artifact@v4
        with:
          pattern: feed-*
          path: feed
      - name: Attach the update feeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          node scripts/merge-latest.mjs out/latest.yml feed/feed-windows-x64/latest.yml feed/feed-windows-arm64/latest.yml
          cp feed/feed-linux-x64/latest-linux.yml out/
          cat out/latest.yml out/latest-linux.yml
          gh release upload "$TAG" out/latest.yml out/latest-linux.yml --clobber
