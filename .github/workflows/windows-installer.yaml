# Builds the Windows installer on GitHub's Windows machine and attaches it, with SHA256SUMS, to a release.
# Run it: GitHub (web or app) -> p9 -> Actions -> Windows installer -> Run workflow, and give the release tag.
# The release must already exist. Windows minutes count double against the private repo's monthly allowance.
name: Windows installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach the installer to (the release must exist)
        required: true
        default: v0.1.1

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag }}
      # NSIS 3.0.4 cannot open paths over 260 characters; the runner's default pnpm cache put
      # electron-builder's StdUtils.nsh at 276. A short cache root keeps the dlx path under the limit.
      npm_config_cache_dir: C:\pc
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26.10.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ponytail: electron-builder publishes by itself when it detects CI (it asked for GH_TOKEN after building the .exe).
      # CI=false keeps this job's upload as the only one; the root fix is --publish never in package-windows.mjs.
      - run: pnpm package:win
        env:
          CI: 'false'
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat dist/windows/SHA256SUMS
          gh release upload "$TAG" dist/windows/*.exe dist/windows/SHA256SUMS --clobber
