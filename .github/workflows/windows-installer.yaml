# Builds the Windows installer on GitHub's Windows machine.
# Run it: GitHub (web or app) -> p9 -> Actions -> Windows installer -> Run workflow, and give the release tag: it builds that
# tag and attaches the .exe and SHA256SUMS to the release (which must already exist). Tags before v0.1.2 lack the
# packaging fix and fail on this machine (the NSIS 260-character path).
# A push to a branch other than main that changes the packaging builds the installer too, as a check only: nothing is
# attached anywhere. Windows minutes count double against the private repo's monthly allowance.
name: Windows installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach the installer to (the release must exist)
        required: true
  push:
    branches-ignore: [main]
    paths:
      - scripts/package-windows.mjs
      - scripts/extract-node-windows.ps1
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/windows-installer.yaml

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26.10.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:win
      - name: Attach to the release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat dist/windows/SHA256SUMS
          gh release upload "$TAG" dist/windows/*.exe dist/windows/SHA256SUMS --clobber
      - name: Show the check build
        if: github.event_name == 'push'
        shell: bash
        run: |
          cat dist/windows/SHA256SUMS
          ls -l dist/windows/*.exe
