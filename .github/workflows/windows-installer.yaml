# Builds the Windows installer on GitHub's Windows machine.
# Run it: GitHub (web or app) -> p9 -> Actions -> Windows installer -> Run workflow, and give the release tag: it builds that
# tag and attaches the .exe and SHA256SUMS to the release (which must already exist). Tags before v0.1.2 lack the
# packaging fix and fail on this machine (the NSIS 260-character path).
# A push to a branch other than main that changes the packaging builds the installer too, as a check only: nothing is
# attached anywhere. Windows minutes count double against the private repo's monthly allowance.
name: Windows installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach the installer to (the release must exist)
        required: true
  push:
    branches-ignore: [main]
    paths:
      - scripts/package-windows.mjs
      - scripts/extract-node-windows.ps1
      - scripts/install-windows.ps1
      - scripts/installer.nsh
      - scripts/windows-host.ps1
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/windows-installer.yaml

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26.10.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:win
      - name: Attach to the release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat dist/windows/SHA256SUMS
          gh release upload "$TAG" dist/windows/*.exe dist/windows/SHA256SUMS --clobber
      - name: Show the check build
        if: github.event_name == 'push'
        shell: bash
        run: |
          cat dist/windows/SHA256SUMS
          ls -l dist/windows/*.exe
      # GitHub issue #4: install the check build here, then see the daemon task start with no window and come back after a
      # stop, the way the desktop app restarts it. A runner's session is not a real desktop, so this proves the task and the
      # daemon, not what a person sees.
      - name: Install it here and start the daemon
        if: github.event_name == 'push'
        shell: pwsh
        timeout-minutes: 10
        run: |
          $exe = (Get-ChildItem dist/windows/*.exe | Select-Object -First 1).FullName
          # Wait for the installer alone (-Wait also waits on its children); run 39522683697 hung here 30 min with no output.
          $setup = Start-Process -FilePath $exe -ArgumentList '/S' -PassThru
          if (-not $setup.WaitForExit(300000)) { throw 'the installer did not finish in 5 min' }
          Write-Output ('installer exit code: ' + $setup.ExitCode)
          # If the service did not start, run its script here so its own error shows in this log.
          $script = Join-Path $env:LOCALAPPDATA 'Programs\P9 Event Horizon\resources\daemon\scripts\install-windows.ps1'
          if (-not (Get-ScheduledTask -TaskName 'P9 Foundation' -ErrorAction SilentlyContinue)) { & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script; throw 'the installer registered no task' }
          $action = (Get-ScheduledTask -TaskName 'P9 Foundation').Actions[0]
          Write-Output ('task runs: ' + $action.Execute + ' ' + $action.Arguments.Substring(0, 40))
          if ($action.Execute -ne 'conhost.exe' -or -not $action.Arguments.StartsWith('--headless ')) { throw 'task is not headless' }
          $file = Join-Path $env:LOCALAPPDATA 'P9\runtime\desktop.json'
          function Wait-Daemon([datetime]$After) {
            $end = (Get-Date).AddSeconds(90)
            while ((Get-Date) -lt $end) { if ((Test-Path $file) -and (Get-Item $file).LastWriteTime -gt $After) { return } ; Start-Sleep 2 }
            Get-ScheduledTaskInfo -TaskName 'P9 Foundation' | Format-List LastRunTime, LastTaskResult
            throw 'the daemon did not write desktop.json in 90 s'
          }
          Wait-Daemon ([datetime]::MinValue)
          Write-Output 'daemon up after install'
          Get-CimInstance Win32_Process -Filter "Name = 'node.exe'" | ForEach-Object { 'node: ' + $_.CommandLine.Substring(0, [Math]::Min(120, $_.CommandLine.Length)) }
          $before = Get-Date
          Stop-ScheduledTask -TaskName 'P9 Foundation'
          Start-Sleep 3
          schtasks.exe /Run /TN 'P9 Foundation'
          Wait-Daemon $before
          Write-Output 'daemon up again after a stop and schtasks /Run (what the app does)'
