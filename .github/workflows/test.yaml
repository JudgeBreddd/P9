# Runs P9's tests on GitHub's Linux machine: every push to a branch other than main, or by hand from
# Actions -> Tests -> Run workflow (optionally naming test files). Linux minutes count once against the
# private repo's monthly allowance.
# The machine gets what the tests need and a laptop has: Chromium's sandbox and unshare (user namespaces),
# a systemd user manager, tmux, ss, GTK 3, a display (Xvfb) and gitleaks 8.19 or newer.
name: Tests

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
    inputs:
      files:
        description: Test files to run, space separated (empty runs them all)
        required: false
        default: ''
      evidence:
        description: Install the editor host and keep the tests' screenshots as an artifact
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# A new push to the same branch cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GITLEAKS: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26.10.0
          cache: pnpm
      - name: Test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tmux xvfb xauth iproute2 libgtk-3-0t64
          curl -fsSLo /tmp/gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS/gitleaks_${GITLEAKS}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  /tmp/gl.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/gl.tgz -C /usr/local/bin gitleaks
          # Ubuntu 24.04 refuses user namespaces to unconfined programs; Chromium's sandbox and the save-fault tests need them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # A systemd user manager for this user, as on a desktop login (the daemon, Stop and restart tests use it).
          sudo loginctl enable-linger "$USER"
          for i in $(seq 1 50); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 0.2; done
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      # The Electron tests load apps/web/dist and apps/dev/dist; the passkey and surface-2 tests use Playwright's own Chromium.
      - run: pnpm build
      - run: pnpm exec playwright install --only-shell chromium
      # Dev Focus tests skip without the editor host; this installs it as the README does, pinned by SHA-256.
      - name: Editor host (evidence runs)
        if: inputs.evidence
        run: |
          curl -fsSLo /tmp/reh.tgz https://github.com/VSCodium/vscodium/releases/download/1.121.03429/vscodium-reh-linux-x64-1.121.03429.tar.gz
          echo "9b27e6957f7cca9b52686eb9866db131e75d37d180ea5ba0f6cdf44b799f75d9  /tmp/reh.tgz" | sha256sum -c -
          mkdir -p ~/.local/share/p9/codium-server
          tar -xzf /tmp/reh.tgz -C ~/.local/share/p9/codium-server
          test -x ~/.local/share/p9/codium-server/bin/codium-server
          mkdir -p "$RUNNER_TEMP/evidence"
          echo "P9_EVIDENCE=$RUNNER_TEMP/evidence" >> "$GITHUB_ENV"
      - name: Tests
        env:
          FILES: ${{ inputs.files }}
        run: |
          systemctl --user is-system-running || true
          if [ -n "$FILES" ]; then xvfb-run -a node scripts/with-tmp.mjs node --test $FILES; else xvfb-run -a pnpm test; fi
      - name: Screenshots (evidence runs)
        if: always() && inputs.evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: ${{ runner.temp }}/evidence
          retention-days: 7
          if-no-files-found: warn
