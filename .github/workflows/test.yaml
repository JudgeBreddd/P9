# Runs P9's tests on GitHub's machines: every pull request (C3, O288: the branch merged with main, not the branch alone) and
# every merge to main that changes more than docs (O230: so each merge gets its own result and two PRs that pass alone but
# break main together show within minutes), or by hand
# from Actions -> Tests -> Run workflow (optionally naming test files; bare runs the bare-machine install instead).
# The repo is public, so the runs cost nothing. 0.1.8 F1: the Linux tests run as 7 shards at once (test/shard.mjs) and the
# Windows-only tests in their own job here, so a push answers in under 10 minutes; the installers build on tags only
# (windows-installer.yaml). Every run keeps each shard's test output as an artifact, pass or fail (0.1.8 O2).
# The machine gets what the tests need and a laptop has: Chromium's sandbox and unshare (user namespaces),
# a systemd user manager, tmux, ss, GTK 3, a display (Xvfb) and gitleaks 8.19 or newer.
name: Tests

on:
  # C3 (O288): a branch push alone runs nothing; its PR does. A draft PR runs only `quick`; marking it ready runs the rest, so
  # keep a PR draft while building and during a fix round and mark it ready once per round.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # No paths filter here: a check that never reports would hold a Markdown-only PR forever once checks are required (C5).
    # `quick` says whether the change needs the heavy jobs; a job it skips counts as passed.
  push:
    branches: [main]
    # A merge of only Markdown runs nothing, except the files tests read (README's editor pin, the licence notices).
    paths:
      - '**'
      - '!**.md'
      - 'README.md'
      - 'LICENSES.md'
      - 'docs/guide.md'
      - 'third-party/**'
  workflow_dispatch:
    inputs:
      files:
        description: Test files to run, space separated (empty runs them all)
        required: false
        default: ''
      evidence:
        description: Install the editor host and keep the tests' screenshots as an artifact
        type: boolean
        required: false
        default: false
      windows:
        description: Run the named files on Windows (x64 and arm64) instead of Linux
        type: boolean
        required: false
        default: false
      bare:
        description: Instead of the tests, install P9 on a bare Ubuntu 24.04 (x64 and arm64), build the static tmux, and read what the Windows programs need (x64 and arm64)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# A new push to the same branch cancels the run it replaces. A bare run has its own group (on a push inputs.bare is
# empty, so the group is the same as before), so it never cancels a test run on the same branch, nor one it.
# O230: on main every run has a group of its own and cancels nothing, so each merge finishes with its own result. Not
# cancel-in-progress false alone: a group holds one waiting run, so a third quick merge would cancel the second's.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ inputs.bare && '-bare' || '' }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # C2 (O287): what a machine can see in 2 minutes, before any shard or Windows job starts: the licence inventory, the scan
  # (gitleaks included) and the convention tests (node test/shard.mjs quick). No build, no browser. Astro check (`pnpm check`)
  # is not here yet: main has 34 type errors (phone.ts, shell-start.ts, phone-errors.ts); row O295 fixes them and adds it.
  quick:
    # Not on a run by hand naming files (#574 r2): those tests start at once, and a named convention test runs only once.
    if: ${{ !inputs.bare && !inputs.files }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      GITLEAKS: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    outputs:
      heavy: ${{ steps.changed.outputs.heavy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # A PR that changes only Markdown (not README.md, LICENSES.md, docs/guide.md or third-party/, which tests read) skips the heavy jobs.
      # (docs/guide.md: Settings links to its headings, test/settings-pages.test.mjs; contracts.md is read by quick's own acp-contract.)
      # On a PR, HEAD is GitHub's merge of the branch into main and HEAD^1 is main, so the diff is the PR's own change.
      - id: changed
        env:
          EVENT: ${{ github.event_name }}
        run: |
          heavy=true
          if [ "$EVENT" = pull_request ]; then
            # --no-renames: a code file renamed to .md lists its old name too, so it is not read as Markdown-only (#574 review).
            files=$(git diff --name-only --no-renames HEAD^1 HEAD)
            if [ -n "$files" ] && ! grep -qv '\.md$' <<<"$files" && ! grep -qE '^(README\.md|LICENSES\.md|docs/guide\.md|third-party/)' <<<"$files"; then heavy=false; fi
          fi
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"; echo "heavy jobs: $heavy"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          cache: pnpm
      - name: Gitleaks
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o /tmp/gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS/gitleaks_${GITLEAKS}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  /tmp/gl.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/gl.tgz -C /usr/local/bin gitleaks
      # Retried: a GitHub/npm 50x during install (Electron's zip comes from github.com) failed whole runs (2026-11-08 outage).
      - run: for i in 1 2 3; do pnpm install --frozen-lockfile && exit 0; echo "install failed ($i of 3), retrying in 30 s"; sleep 30; done; exit 1
        shell: bash
      # Each check runs even when one before it failed, so one red names every problem. O232: dependency-licenses.json
      # matches what is installed (Linux only: elsewhere optional platform packages read installed: false).
      - name: Licence inventory
        run: node scripts/licenses.mjs
      - name: Scan
        if: ${{ !cancelled() }}
        run: node scripts/scan.mjs
      # The shards' reporters: spec for people, test/file-limit.mjs's P9_PASS lines for the sprint gate (#574 r1: without
      # them a plan row naming one of these tests could never pass scripts/green-check.mjs).
      - name: Convention tests
        if: ${{ !cancelled() }}
        run: node scripts/with-tmp.mjs node --test --test-timeout=120000 --test-force-exit --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./test/file-limit.mjs --test-reporter-destination=stderr $(node test/shard.mjs quick)

  linux:
    # On a push the inputs are empty: !inputs.bare is !null, true, so the tests run as before. C2/C3: after quick passes,
    # when the change needs it, and not on a draft PR (on a push github.event.pull_request is null, so !draft is true).
    # A run by hand naming files runs them whatever quick says (#574 r1: a red quick must not hide the test being diagnosed).
    needs: quick
    if: ${{ !cancelled() && !inputs.bare && !inputs.windows && (inputs.files != '' && inputs.files != null || needs.quick.result == 'success' && needs.quick.outputs.heavy == 'true' && !github.event.pull_request.draft) }}
    strategy:
      # One shard failing still finishes the others, so a red run names every failing file.
      fail-fast: false
      matrix:
        # files (dispatch) runs just those files, on one runner. The quarantine shard is the job below.
        shard: ${{ fromJSON(inputs.files && '[0]' || '[0, 1, 2, 3, 4, 5, 6]') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env: &linux-env
      GITLEAKS: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps: &linux-steps
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          cache: pnpm
      - name: Test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tmux xvfb xauth x11-utils iproute2 libgtk-3-0t64
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o /tmp/gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS/gitleaks_${GITLEAKS}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  /tmp/gl.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/gl.tgz -C /usr/local/bin gitleaks
          # Ubuntu 24.04 refuses user namespaces to unconfined programs; Chromium's sandbox and the save-fault tests need them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # A systemd user manager for this user, as on a desktop login (the daemon, Stop and restart tests use it).
          sudo loginctl enable-linger "$USER"
          for i in $(seq 1 50); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 0.2; done
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      # Retried: a GitHub/npm 50x during install (Electron's zip comes from github.com) failed whole runs (2026-11-08 outage).
      - id: install
        run: for i in 1 2 3; do pnpm install --frozen-lockfile && exit 0; echo "install failed ($i of 3), retrying in 30 s"; sleep 30; done; exit 1
        shell: bash
      # The Electron tests load apps/web/dist and apps/dev/dist; the passkey and surface-2 tests use Playwright's own Chromium.
      - run: pnpm build
      - run: pnpm exec playwright install --only-shell chromium
      # Dev Focus tests skip without the editor host; this installs it as the README does, pinned by SHA-256.
      - name: Editor host (evidence runs)
        if: inputs.evidence
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o /tmp/reh.tgz https://github.com/VSCodium/vscodium/releases/download/1.121.03429/vscodium-reh-linux-x64-1.121.03429.tar.gz
          echo "9b27e6957f7cca9b52686eb9866db131e75d37d180ea5ba0f6cdf44b799f75d9  /tmp/reh.tgz" | sha256sum -c -
          mkdir -p ~/.local/share/p9/codium-server
          tar -xzf /tmp/reh.tgz -C ~/.local/share/p9/codium-server
          test -x ~/.local/share/p9/codium-server/bin/codium-server
          mkdir -p "$RUNNER_TEMP/evidence"
          echo "P9_EVIDENCE=$RUNNER_TEMP/evidence" >> "$GITHUB_ENV"
      - name: Tests
        env:
          FILES: ${{ inputs.files }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -o pipefail
          # O71: a test with no timeout of its own fails after 10 min with its name, and a file whose tests are done exits
          # even if a child it started still holds a handle (two jobs hung 29 min with no name, #108 and #111).
          # The hang row (0.1.9 phase 4.5): test/file-limit.mjs names a file still running after 1200 s and kills it, which
          # --test-timeout cannot when the file's event loop is blocked or it hangs outside a test (test/file-limit.test.mjs).
          # The job log gets lines cut at 2,000 characters; tests.log (the artifact) keeps them whole. #115's linux (6) job
          # log stopped at the first P9_SHOT line (a 69 KB picture), so its failing test and summary never showed there.
          systemctl --user is-system-running || true
          run() { xvfb-run -a node scripts/with-tmp.mjs node --test --test-timeout=600000 --test-force-exit --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./test/file-limit.mjs --test-reporter-destination=stderr "$@" 2>&1 | tee -a "$RUNNER_TEMP/tests.log" | cut -c1-2000; }
          # C1 (O286): a test that fails on a commit that did not touch its code, twice in 7 days, is quarantined with an
          # open row (test/quarantine.json): the shards skip it, this job's quarantine shard runs it and reports. Still never
          # retried. The quarantine shard exits 0; its summary says which tests failed.
          if [ "$SHARD" = quarantine ]; then
            QPAT=$(node test/shard.mjs pattern); QFILES=$(node test/shard.mjs quarantine)
            # #573 r1 #4 (O293): each call's exit code and each entry's outcome, so a call that dies before any result shows.
            touch "$RUNNER_TEMP/tests.log"; timed=0; quarantined='none listed'
            P9_TIMED=1 run test/shell-bundle.test.mjs || timed=$?
            if [ -n "$QFILES" ]; then quarantined=0; run --test-name-pattern="$QPAT" $QFILES || quarantined=$?; fi
            { echo '### Quarantined tests (not blocking)'; echo "- shell-bundle timing call: exit $timed"; echo "- quarantined tests call: exit $quarantined"
              node test/shard.mjs report "$RUNNER_TEMP/tests.log"; grep -E '^\s*(✔|✖) ' "$RUNNER_TEMP/tests.log" | grep -v 'failing tests' || echo 'no result lines'; } >> "$GITHUB_STEP_SUMMARY"
            grep -E '^\s*(✔|✖) ' "$RUNNER_TEMP/tests.log" || true
            exit 0
          fi
          # O208: a file that times the app (shell-bundle's warm usable ms) runs alone after the others, one node --test each;
          # so does a quarantined file, and only its own call skips its quarantined tests, and only on automatic shards: a
          # dispatched file runs in full, since its author asked for it (#573 r1).
          DISPATCHED=$FILES
          if [ -z "$FILES" ]; then FILES=$(node test/shard.mjs "$SHARD" 7); fi
          TOGETHER=$(node test/shard.mjs together $FILES); ALONE=$(node test/shard.mjs alone $FILES); rc=0
          echo "shard $SHARD: $TOGETHER${ALONE:+, then alone: $ALONE}"
          for FILES in "$TOGETHER" $ALONE; do
            [ -n "$FILES" ] || continue
            P=; [ -n "$DISPATCHED" ] || P=$(node test/shard.mjs pattern $FILES)
            SKIP=(); [ -n "$P" ] && SKIP=(--test-skip-pattern="$P")
            run "${SKIP[@]}" $FILES || rc=$?
          done
          exit $rc
      # The output the result rests on, kept on every run (a failure too), not only in the job log.
      - name: Test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-log-${{ matrix.shard }}
          path: ${{ runner.temp }}/tests.log
          retention-days: 14
          if-no-files-found: warn
      - name: Screenshots (evidence runs)
        if: always() && inputs.evidence
        uses: actions/upload-artifact@v7
        with:
          name: evidence-${{ matrix.shard }}
          path: ${{ runner.temp }}/evidence
          retention-days: 7
          if-no-files-found: warn

  # C1 (O286): runs test/quarantine.json's tests and shell-bundle's warm-usable timing (P9_TIMED), prints pass or fail for
  # each, and never blocks. #577 r1 #3 (O293): its own job, not a leg of linux, so `tests` (which needs linux) never waits
  # for it; the linux job's env and steps (YAML anchors), with a one-entry matrix so matrix.shard reads quarantine.
  quarantine:
    name: linux (quarantine)
    needs: quick
    if: ${{ !cancelled() && !inputs.bare && !inputs.windows && !inputs.files && needs.quick.result == 'success' && needs.quick.outputs.heavy == 'true' && !github.event.pull_request.draft }}
    strategy:
      matrix:
        shard: [quarantine]
    runs-on: ubuntu-26.04
    continue-on-error: true
    timeout-minutes: 30
    env: *linux-env
    steps: *linux-steps

  # The Windows-only tests on a real Windows machine of each architecture, no installer build (0.1.8 F1: they ran inside
  # windows-installer.yaml's installer job until installers moved to tags). The host (.cmd through cmd.exe, a new console,
  # the folder ACL check, the prebuilt DLL) and Job Object stop; the dock's terminal on ConPTY (GitHub issue #11); Mission
  # notes outside the workspace (v0.1.5 N1); the file guard and the editor host's owner-only checks; Dev Focus's folder
  # outside the workspace (v0.1.5 DV2). Each step runs even when one before it failed, so one red test hides no other.
  # C1 (O286): a test that fails on a commit that did not touch its code, twice in 7 days, is quarantined with an open row
  # (test/quarantine.json; the Linux shards skip it). Windows has its own fixed list here and no quarantine yet. Never retried.
  windows:
    needs: quick
    if: ${{ !cancelled() && !inputs.bare && (!inputs.files || inputs.windows) && (inputs.windows || needs.quick.result == 'success' && needs.quick.outputs.heavy == 'true' && !github.event.pull_request.draft) }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-latest' }}
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          cache: pnpm
      # Retried: a GitHub/npm 50x during install (Electron's zip comes from github.com) failed whole runs (2026-11-08 outage).
      - run: for i in 1 2 3; do pnpm install --frozen-lockfile && exit 0; echo "install failed ($i of 3), retrying in 30 s"; sleep 30; done; exit 1
        shell: bash
      - name: Test output folder
        run: New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\evidence" | Out-Null
      - name: Windows host and process-tree tests
        if: ${{ !cancelled() && !inputs.files }}
        run: node --test test/windows-process-tree.test.mjs *>&1 | Tee-Object -Append "$env:RUNNER_TEMP\evidence\tests.log"; exit $LASTEXITCODE
      - name: Windows worker setup stop test
        if: ${{ !cancelled() && !inputs.files }}
        # 0.1.9 A4: a worker folder's setup command past its cap ends with its whole Job Object, live or exited parent.
        run: node --test --test-name-pattern="past its cap" test/worker-folders.test.mjs *>&1 | Tee-Object -Append "$env:RUNNER_TEMP\evidence\tests.log"; exit $LASTEXITCODE
      - name: Windows terminal test
        if: ${{ !cancelled() && !inputs.files }}
        run: node --test test/windows-terminal.test.mjs *>&1 | Tee-Object -Append "$env:RUNNER_TEMP\evidence\tests.log"; exit $LASTEXITCODE
      - name: Windows notes test
        if: ${{ !cancelled() && !inputs.files }}
        run: node --test test/mission-notes.test.mjs *>&1 | Tee-Object -Append "$env:RUNNER_TEMP\evidence\tests.log"; exit $LASTEXITCODE
      - name: Windows file guard test
        if: ${{ !cancelled() && !inputs.files }}
        # BL9: Windows PowerShell 5.1 started from this pwsh 7 step inherits its module folders and fails to load Get-Acl's
        # module (run 40139947301): keep only its own, as install-windows.ps1 does. Inside the step: pwsh adds its own back
        # at each start, so a GITHUB_ENV value does not hold (run 42431371413).
        run: |
          $env:PSModulePath = (($env:PSModulePath -split ';') | Where-Object { $_ -notmatch '\\PowerShell\\' }) -join ';'
          node --test test/files-windows.test.mjs *>&1 | Tee-Object -Append "$env:RUNNER_TEMP\evidence\tests.log"; exit $LASTEXITCODE
      - name: Windows editor host test
        if: ${{ !cancelled() && !inputs.files }}
        # BL9: Windows PowerShell 5.1 started from this pwsh 7 step inherits its module folders and fails to load Get-Acl's
        # module (run 40139947301): keep only its own, as install-windows.ps1 does. Inside the step: pwsh adds its own back
        # at each start, so a GITHUB_ENV value does not hold (run 42431371413).
        run: |
          $env:PSModulePath = (($env:PSModulePath -split ';') | Where-Object { $_ -notmatch '\\PowerShell\\' }) -join ';'
          node --test --test-name-pattern="Phase 8 \(Windows\)" test/dev.test.mjs *>&1 | Tee-Object -Append "$env:RUNNER_TEMP\evidence\tests.log"; exit $LASTEXITCODE
      - name: Windows Dev folder test
        if: ${{ !cancelled() && !inputs.files }}
        run: node --test test/dev-root.test.mjs *>&1 | Tee-Object -Append "$env:RUNNER_TEMP\evidence\tests.log"; exit $LASTEXITCODE
      # files (dispatch): just these test files on each architecture.
      - name: The chosen Windows tests
        if: ${{ inputs.files }}
        env:
          P9_FILES: ${{ inputs.files }}
        run: |
          $env:PSModulePath = (($env:PSModulePath -split ';') | Where-Object { $_ -notmatch '\\PowerShell\\' }) -join ';'
          $files = @($env:P9_FILES -split '\s+' | Where-Object { $_ })
          foreach ($f in $files) {
            if ($f -notmatch '^test/[A-Za-z0-9_-]+(\.[A-Za-z0-9_-]+)*\.test\.mjs$' -or -not (Test-Path -LiteralPath $f -PathType Leaf)) { throw "files: not a test file here: $f" }
          }
          node --test @files *>&1 | Tee-Object -Append "$env:RUNNER_TEMP\evidence\tests.log"
          exit $LASTEXITCODE
      - name: Test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-log-windows-${{ matrix.arch }}
          path: ${{ runner.temp }}/evidence/tests.log
          retention-days: 14
          if-no-files-found: warn

  # C5 (O290): the one check GitHub requires on main (.github/ruleset-main.json, with R5's `review`). A required check must
  # report on every PR, but a matrix job that is skipped reports once under its bare name (`linux`, not `linux (0)`), so
  # naming the shards would hold every PR whose heavy jobs skip forever. This job waits for quick and the heavy jobs and
  # passes when quick passed and each heavy job passed, or was skipped because quick said the change does not need it or
  # the PR is a draft (the quarantine shard cannot fail it). A run by hand skips quick on purpose, so there the job only
  # says so and passes, under another name: a dispatched run on a PR's head never adds a `tests` result to that commit.
  # #577 r1: this file comes from the PR itself, so the gate is only as good as its review; the ruleset also requires
  # `review` (R5), the reviewer's pass on that exact head, which a change to this job needs like any other.
  tests:
    name: ${{ github.event_name == 'workflow_dispatch' && 'tests (by hand)' || 'tests' }}
    needs: [quick, linux, windows]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Quick passed; each heavy job passed, or was skipped when not due
        env:
          EVENT: ${{ github.event_name }}
          QUICK: ${{ needs.quick.result }}
          HEAVY: ${{ needs.quick.outputs.heavy }}
          DRAFT: ${{ github.event.pull_request.draft }}
          LINUX: ${{ needs.linux.result }}
          WINDOWS: ${{ needs.windows.result }}
        run: |
          echo "event $EVENT, quick $QUICK (heavy $HEAVY, draft ${DRAFT:-no}), linux $LINUX, windows $WINDOWS"
          [ "$EVENT" != workflow_dispatch ] || { echo "a run by hand: the jobs above are its result"; exit 0; }
          [ "$QUICK" = success ] || { echo "quick did not pass"; exit 1; }
          case "$HEAVY" in true|false) ;; *) echo "quick gave heavy '$HEAVY', not true or false"; exit 1;; esac
          due=skipped; [ "$HEAVY" = true ] && [ "$DRAFT" != true ] && due=success
          for r in "$LINUX" "$WINDOWS"; do [ "$r" = success ] || [ "$r" = "$due" ] || { echo "a heavy job ended $r (due: $due)"; exit 1; }; done

  # Item 15 (v0.1.6 c13): what a bare Ubuntu 24.04 lacks for P9, found by installing on one, and the static tmux build
  # (scripts/bare-machine.sh, which says what each step does). By hand only, with bare.
  bare:
    if: ${{ inputs.bare }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Boot a bare Ubuntu 24.04
        run: bash scripts/bare-machine.sh boot
      - name: Install P9 on it and list what it lacked
        run: set -o pipefail; bash scripts/bare-machine.sh discover 2>&1 | tee "$RUNNER_TEMP/discover.log"
      - name: Static tmux
        run: set -o pipefail; bash scripts/bare-machine.sh tmux "$RUNNER_TEMP/tmux" 2>&1 | tee "$RUNNER_TEMP/tmux.log"
      # Step B: install.sh as a user meets it on a fresh bare machine each time, answering yes to its admin question.
      - name: Server install (headless) asks, installs, runs
        if: always()
        run: set -o pipefail; bash scripts/bare-machine.sh boot && bash scripts/bare-machine.sh install headless 2>&1 | tee "$RUNNER_TEMP/install-headless.log"
      - name: Desktop install asks, installs, and its Electron starts
        if: always()
        run: set -o pipefail; bash scripts/bare-machine.sh boot && bash scripts/bare-machine.sh install desktop 2>&1 | tee "$RUNNER_TEMP/install-desktop.log"
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bare-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/discover.log
            ${{ runner.temp }}/tmux.log
            ${{ runner.temp }}/install-headless.log
            ${{ runner.temp }}/install-desktop.log
            ${{ runner.temp }}/tmux
          retention-days: 7
          if-no-files-found: warn

  # Item 15 on Windows: GitHub has no bare Windows, so what each program P9 ships needs is read from the program itself.
  # Every DLL that node.exe (setup-node's 26.10.0 is the nodejs.org build package-windows.mjs ships) and the Claude and
  # Codex programs in the adapters import is either part of Windows (System32, an api-ms-/ext-ms- set) or a NEEDS line;
  # the VC++ runtime (vcruntime140, msvcp140) is a NEEDS line even though this runner has it, since a fresh Windows does
  # not. Then each runs with PATH cut to Windows' own folders.
  bare-windows:
    if: ${{ inputs.bare }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
      # Retried: a GitHub/npm 50x during install (Electron's zip comes from github.com) failed whole runs (2026-11-08 outage).
      - run: for i in 1 2 3; do pnpm install --frozen-lockfile && exit 0; echo "install failed ($i of 3), retrying in 30 s"; sleep 30; done; exit 1
        shell: bash
      - name: What each shipped program imports
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dumpbin = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -find '**\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin not found' }
          $programs = @((Get-Command node).Source) + @(Get-ChildItem node_modules\.pnpm -Recurse -Filter *.exe | Where-Object { $_.FullName -match 'claude|codex' } | ForEach-Object FullName)
          foreach ($cli in 'claude.exe', 'codex.exe') { if (-not ($programs | Where-Object { (Split-Path $_ -Leaf) -eq $cli })) { throw "$cli not found in node_modules: the adapters ship it some other way here" } }
          $out = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\bare-windows"
          foreach ($program in $programs) {
            $text = & $dumpbin /nologo /dependents $program
            $dlls = $text | Where-Object { $_ -match '^\s+\S+\.dll\s*$' } | ForEach-Object { $_.Trim().ToLower() }
            $name = Split-Path $program -Leaf
            Write-Output "BARE_WIN_DEPS $name ($program): $($dlls -join ' ')"
            foreach ($dll in $dlls) {
              if ($dll -match '^(vcruntime|msvcp|concrt|vccorlib)\d') { Write-Output "BARE_WIN_NEEDS $name $dll VC++ runtime (not on a fresh Windows)" }
              elseif ($dll -match '^(api|ext)-ms-' -or (Test-Path "$env:SystemRoot\System32\$dll")) { }
              else { Write-Output "BARE_WIN_NEEDS $name $dll not in System32" }
            }
            $text | Set-Content "$out\$name.dependents.txt"
          }
          Get-WindowsCapability -Online -Name OpenSSH.Client* | ForEach-Object { Write-Output "BARE_WIN_SSH $($_.Name) $($_.State)" }
      - name: Each runs with PATH cut to Windows' own folders
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $node = (Get-Command node).Source
          $programs = @($node) + @(Get-ChildItem node_modules\.pnpm -Recurse -Include claude.exe, codex.exe | ForEach-Object FullName)
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          $failed = 0
          foreach ($program in $programs) {
            $text = & $program --version 2>&1
            $code = $LASTEXITCODE
            Write-Output "BARE_WIN_RUN $(Split-Path $program -Leaf) exit $code $($text | Select-Object -First 1)"
            if ($code -ne 0) { $failed++ }
          }
          if ($failed) { throw "$failed program(s) did not start with PATH cut to Windows' folders" }
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bare-${{ matrix.runner }}
          path: ${{ runner.temp }}/bare-windows
          retention-days: 7
          if-no-files-found: warn
